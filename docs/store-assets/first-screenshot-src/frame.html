<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1280px;height:800px;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(1000px 620px at 50% 78%, #1d4f5f 0%, #102a35 55%, #0b1c24 100%);color:#fff;position:relative}
  .head{position:absolute;top:58px;left:0;right:0;text-align:center}
  h1{margin:0;font-size:60px;font-weight:700;letter-spacing:-1px}
  .sub{margin-top:14px;font-size:27px;color:#cfe3ea;font-weight:500}
  .card{position:absolute;left:50%;top:232px;transform:translateX(-50%);width:576px;height:510px;border-radius:18px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
  .card img{width:576px;height:510px;display:block}
  .foot{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:19px;color:#9fc0cb;letter-spacing:.2px}
  .tag{position:absolute;left:calc(50% + 300px);top:268px;background:#c5d97f;color:#13313b;font-weight:700;font-size:20px;
    padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .tag:before{content:"";position:absolute;left:-9px;top:15px;border:9px solid transparent;border-left:0;border-right-color:#c5d97f}
</style></head>
<body>
  <div class="head">
    <h1>Find any old AI chat in seconds</h1>
    <div class="sub">ChatGPT, Claude, Gemini, Google AI Mode, Character.AI and more</div>
  </div>
  <div class="card"><img src="ui-popup-crop.png"></div>
  <div class="foot">Free · Searches on your device · No account needed</div>
</body></html>
